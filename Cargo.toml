[package]
name = "argospass"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
arboard = "3"
argon2 = { version = "0.5", features = ["std", "zeroize"] }
chacha20poly1305 = "0.10"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "6"
env_logger = "0.11"
getrandom = { version = "0.3", features = ["std"] }
hkdf = "0.12"
log = "0.4"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
thiserror = "2.0.21"
zeroize = { version = "1.9.1", features = ["derive"] }

[profile.dev.package."*"]
opt-level = 3
