[package]
name = "argospass"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.3"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.dev.package."*"]
opt-level = 3
